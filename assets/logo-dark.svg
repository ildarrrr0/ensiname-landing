<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" role="img" aria-label="Ensina me — языковой центр">
  <!-- Вариант логотипа для тёмного фона (подпись — светлая). -->
  <defs>
    <linearGradient id="grnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ba03a"/>
      <stop offset="1" stop-color="#0f7a25"/>
    </linearGradient>
    <linearGradient id="redd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e11d22"/>
      <stop offset="1" stop-color="#b30f14"/>
    </linearGradient>
  </defs>
  <polygon points="34,20 342,20 330,150 34,150 60,85"
           fill="url(#grnd)" stroke="#0c5d1c" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="342,20 506,20 480,85 506,150 330,150"
           fill="url(#redd)" stroke="#8f0c11" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="40,26 500,26 498,40 42,40" fill="#ffffff" opacity="0.14"/>
  <g font-family="'Arial Black','Segoe UI',sans-serif" font-weight="900" fill="#ffd21e" stroke="#caa400" stroke-width="1">
    <text x="185" y="112" font-size="82" text-anchor="middle" letter-spacing="-2">ensina</text>
    <text x="416" y="112" font-size="82" text-anchor="middle" letter-spacing="-2">me</text>
  </g>
  <text x="270" y="192" text-anchor="middle" font-family="'Segoe UI',sans-serif"
        font-size="26" letter-spacing="14" fill="#e6e9ec">языковой центр</text>
</svg>
